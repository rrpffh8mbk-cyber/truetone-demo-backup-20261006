<!doctype html>
<meta charset="utf-8">
<title>Lip ROI regression tests</title>
<pre id="result">Running…</pre>
<script type="module">
import {OUTER,INNER,createLipMask} from '../lips.js';
import {analyzeImageFile,runFourAgents,circularHueDistance} from '../agents.js';
import {createVirtualTryOn} from '../tryon.js';
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const landmarks=Array.from({length:468},()=>({x:.5,y:.5}));
for(const [ids,rx,ry] of [[OUTER,.3,.2],[INNER,.14,.08]])ids.forEach((id,i)=>{const a=i/ids.length*2*Math.PI;landmarks[id]={x:.5+rx*Math.cos(a),y:.5+ry*Math.sin(a)}});
let noFace=false,fail=false,busy=false;
window.FaceMesh=class{
 setOptions(){}
 onResults(cb){this.callback=cb}
 async send(){
  assert(!busy,'Concurrent FaceMesh requests must be serialized');busy=true;
  try{await new Promise(r=>setTimeout(r,5));if(fail)throw Error('Model unavailable');this.callback({multiFaceLandmarks:noFace?[]:[landmarks]})}finally{busy=false}
 }
};
const canvas=document.createElement('canvas');canvas.width=200;canvas.height=200;
const ctx=canvas.getContext('2d');
const file=async()=>new File([await new Promise(r=>canvas.toBlob(r))],'fixture.png',{type:'image/png'});
try{
 const mask=createLipMask(landmarks,200,200);
 assert(mask.getContext('2d').getImageData(100,100,1,1).data[3]===0,'Mouth interior must be excluded');
 for(const [label,rgb,hue] of [['blue',[20,35,200],235],['red',[180,30,30],0],['purple',[150,30,180],288]]){
  ctx.fillStyle='#d03030';ctx.fillRect(0,0,200,200); // Red background must not enter ROI.
  const pixels=ctx.getImageData(0,0,200,200),m=mask.getContext('2d').getImageData(0,0,200,200).data;
  for(let i=0;i<m.length;i+=4)if(m[i+3]>=128)pixels.data.set(rgb,i);
  ctx.putImageData(pixels,0,0);ctx.fillStyle='white';ctx.fillRect(95,95,10,10);
  const analysis=await analyzeImageFile(await file());
  assert(analysis.metrics.roiDetected,label+' lips must be detected');
  assert(circularHueDistance(analysis.metrics.hue,hue)<3,label+' hue must use lip pixels only');
 }
 const input=await file();
 const pair=await Promise.all([analyzeImageFile(input),createVirtualTryOn(input,{analysis:{center:{hue:15,saturation:40,brightness:60}}})]);
 assert(pair[0].metrics.roiDetected&&pair[1].tryon,'Analysis and try-on must share serialized detector');
 for(const unavailable of [false,true]){
  noFace=!unavailable;fail=unavailable;
  const analysis=await analyzeImageFile(input),report=runFourAgents([analysis],{analysis:{center:{hue:20}}});
  assert(analysis.metrics.hue===null&&!analysis.metrics.roiDetected,'Missing ROI must not fabricate red hue');
  assert(report.score===null&&report.confidence===0,'Missing ROI must not receive a lip credibility score');
  assert(!report.findings.some(f=>f.type==='与多来源参考色域偏离'),'Missing ROI must not enter color comparisons');
 }
 fail=false;noFace=false;
 assert((await analyzeImageFile(input)).metrics.roiDetected,'Detector must recover after failure');
 document.querySelector('#result').textContent='PASS: blue/red/purple lips, red background exclusion, mouth exclusion, concurrent analysis/try-on, no face, model failure and recovery.';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;throw e}
</script>
